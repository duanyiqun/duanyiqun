name: activity card

on:
  schedule:
    - cron: '23 4 * * *'   # daily, off the hour: scheduled runs at :00 queue behind everyone else
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'fixtures/**'
      - '.github/workflows/activity.yml'

permissions:
  contents: write

concurrency:
  group: activity-output
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render the card from the live contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/activity_card.py \
            --login "${{ github.repository_owner }}" \
            --stamp "$(date -u +%F)" \
            --out out

      - name: Validate before publishing
        run: python scripts/check_svg.py out/activity-dark.svg out/activity-light.svg

      - name: Publish to the output branch
        run: |
          date -u +%FT%TZ > out/stamp.txt
          cd out
          git init -q
          git checkout -q --orphan output
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "activity card $(cat stamp.txt)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output
